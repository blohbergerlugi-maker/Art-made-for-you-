<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Made For You</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: sticky shop header, hero with product collage, filterable product grid, side cart, account page, and a separate admin portal with sidebar. Ink and tangerine with six pop colours for product tiles. */
:root {
  --bg: #f5f4fb; --surface: #ffffff; --surface-2: #eceaf6; --ink: #1b1a2e; --muted: #5f5d78; --line: #dad8ea;
  --accent: #ff6b1a; --accent-ink: #1b1a2e; --good: #11704a; --warn: #8a5a00; --bad: #b3261e;
  --pop0: #ff9a52; --pop1: #3dd6a3; --pop2: #ffd23f; --pop3: #62b6ff; --pop4: #ff7eb6; --pop5: #a99bff;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12111c; --surface: #1c1b2c; --surface-2: #26253a; --ink: #f3f2ff; --muted: #a9a7c4; --line: #2f2e47;
    --accent: #ff8a45; --accent-ink: #1b1a2e; --good: #62d9a2; --warn: #f1c35f; --bad: #ff9088;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12111c; --surface: #1c1b2c; --surface-2: #26253a; --ink: #f3f2ff; --muted: #a9a7c4; --line: #2f2e47;
  --accent: #ff8a45; --accent-ink: #1b1a2e; --good: #62d9a2; --warn: #f1c35f; --bad: #ff9088;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); margin: 0; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1160px; margin: 0 auto; }
.muted { color: var(--muted); }

/* buttons and fields */
.btn { border: 2px solid var(--ink); background: var(--surface); border-radius: 999px; padding: 8px 18px; font-weight: 700; cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { padding: 5px 12px; font-size: 0.85rem; border-width: 1.5px; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; color: inherit; }
label.f, div.f { display: grid; gap: 4px; font-size: 0.85rem; font-weight: 500; color: var(--muted); min-width: 0; }
input.in, select.in, textarea.in { font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; min-width: 0; }
input.in:focus, select.in:focus, textarea.in:focus { border-color: var(--accent); }
textarea.in { min-height: 90px; resize: vertical; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; padding: 4px 10px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.prefs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* product art and avatars */
.tile { --f: var(--pop0); --g: var(--pop3); background: color-mix(in srgb, var(--f) 26%, var(--surface)); display: grid; place-items: center; aspect-ratio: 1 / 1; position: relative; overflow: hidden; }
.tile svg { width: 72%; height: 72%; }
.tile.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.badge { position: absolute; top: 10px; left: 10px; z-index: 1; background: var(--ink); color: var(--bg); font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.badge.soon { background: var(--surface); color: var(--ink); border: 1.5px solid var(--ink); }
.avatar { --s: 40px; width: var(--s); height: var(--s); flex: none; border-radius: 50%; display: inline-grid; place-items: center; background: var(--f); color: #1b1a2e; border: 2px solid #1b1a2e; font: 800 calc(var(--s) * 0.38) var(--font-display); letter-spacing: 0; }

/* shop header */
.top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1.5px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 10px 14px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; letter-spacing: -0.02em; text-align: left; }
.brand svg { width: 38px; height: 38px; flex: none; }
.search { flex: 1 1 180px; max-width: 340px; margin-left: auto; }
.nav { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.nav button { background: none; border: 0; font-weight: 700; padding: 8px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.nav button:hover, .nav button[aria-current="page"] { background: var(--surface-2); }
.nav button.admbtn { border: 1.5px dashed var(--ink); }
.nav button.admbtn small { font-weight: 500; color: var(--muted); }
.cartbtn b { background: var(--accent); color: var(--accent-ink); border-radius: 999px; min-width: 22px; height: 22px; display: inline-grid; place-items: center; font-size: 0.8rem; padding: 0 6px; }

/* hero */
.hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 28px; align-items: center; padding-block: 36px 28px; }
.hero h1 { font-size: clamp(2.2rem, 5.4vw, 4rem); font-weight: 800; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--pop2) 62% 92%, transparent 92%); }
.hero p { font-size: 1.1rem; max-width: 46ch; color: var(--muted); margin: 14px 0 22px; }
.collage { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: end; }
.collage .tile { border: 2px solid var(--ink); border-radius: 22px; }
.collage .tile:nth-child(1) { rotate: -4deg; } .collage .tile:nth-child(2) { translate: 0 -14px; rotate: 2deg; } .collage .tile:nth-child(3) { rotate: 5deg; }
.perks { display: flex; gap: 8px 22px; flex-wrap: wrap; font-size: 0.92rem; font-weight: 500; padding-bottom: 8px; }
.perks span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); margin-right: 8px; }

/* catalog */
.chips { display: flex; gap: 8px; flex-wrap: wrap; padding-block: 18px 6px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 500; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; padding-block: 14px 48px; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card .info { padding: 14px 16px 16px; display: grid; gap: 4px; flex: 1; align-content: start; }
.card h3 { font-size: 1.1rem; }
.card .cat { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.card .buy { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.price { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.empty { padding: 48px 16px; text-align: center; color: var(--muted); }

/* overlays */
.scrim { position: fixed; inset: 0; background: rgba(15, 14, 30, .55); z-index: 50; display: grid; place-items: center; padding: 16px; }
.scrim.right { place-items: stretch end; padding: 0; }
.modal { background: var(--surface); border: 2px solid var(--ink); border-radius: 24px; width: min(760px, 100%); max-height: calc(100% - 8px); overflow: auto; }
.modal.narrow { width: min(480px, 100%); }
.modal .pad { padding: 22px; display: grid; gap: 14px; }
.pdetail { display: grid; grid-template-columns: 1fr 1fr; }
.pdetail .tile { border-radius: 22px 0 0 22px; min-height: 260px; aspect-ratio: auto; }
.drawer { background: var(--surface); width: min(420px, 100%); height: 100%; display: flex; flex-direction: column; border-left: 2px solid var(--ink); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer header { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1.5px solid var(--line); }
.drawer .lines { flex: 1; overflow: auto; padding: 8px 18px; }
.line { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.line .tile { width: 56px; border-radius: 12px; aspect-ratio: 1; }
.line .tile svg { width: 80%; height: 80%; }
.qty { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; }
.qty button { background: none; border: 0; width: 30px; height: 30px; cursor: pointer; font-weight: 700; border-radius: 50%; }
.qty button:hover { background: var(--surface-2); }
.qty span { min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; }
.totals { padding: 16px 18px; border-top: 1.5px solid var(--line); display: grid; gap: 6px; }
.totals div { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.totals .grand { font-weight: 700; font-size: 1.15rem; }
.toast { position: fixed; left: 50%; translate: -50% 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 90; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 500; max-width: calc(100% - 32px); }

/* account */
.page { padding-block: 32px 56px; display: grid; gap: 22px; }
.page h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 20px; padding: 22px; display: grid; gap: 14px; min-width: 0; }
.panel h2 { font-size: 1.25rem; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; align-items: start; }
.authbox { max-width: 460px; margin: 0 auto; width: 100%; }
.tabs2 { display: flex; gap: 6px; }
.tabs2 button { flex: 1; border: 1.5px solid var(--line); background: var(--surface); padding: 8px; border-radius: 999px; font-weight: 700; cursor: pointer; }
.tabs2 button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.hint { background: var(--surface-2); border-radius: 12px; padding: 10px 14px; font-size: 0.88rem; display: grid; gap: 6px; }
.err { color: var(--bad); font-size: 0.9rem; min-height: 1.3em; margin: 0; }
.orderrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.orderrow:last-child { border-bottom: 0; }
.orderrow .acts { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 11px; font-size: 0.8rem; font-weight: 700; border: 1.5px solid currentColor; }
.pill.s-New { color: var(--warn); } .pill.s-Packed { color: var(--muted); } .pill.s-Shipped { color: var(--accent); } .pill.s-Delivered { color: var(--good); } .pill.s-Cancelled { color: var(--bad); }
.who { display: flex; gap: 14px; align-items: center; }
.who .avatar { --s: 72px; }
footer.foot { border-top: 1.5px solid var(--line); padding-block: 22px 32px; font-size: 0.9rem; color: var(--muted); }
footer.foot .wrap { display: flex; gap: 10px 24px; flex-wrap: wrap; justify-content: space-between; align-items: center; }

/* admin */
.adm { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--ink); color: var(--bg); padding: 20px 14px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.side .brand { color: var(--bg); padding: 4px 8px 16px; font-size: 1.05rem; cursor: default; }
.side .tag { font: 700 0.7rem var(--font-body); text-transform: uppercase; letter-spacing: .12em; background: var(--accent); color: var(--accent-ink); padding: 2px 8px; border-radius: 999px; margin-left: auto; }
.side button.nv { background: none; border: 0; color: inherit; text-align: left; padding: 10px 12px; border-radius: 12px; font-weight: 500; cursor: pointer; opacity: .85; }
.side button.nv:hover { background: rgba(127,127,127,.25); opacity: 1; }
.side button.nv[aria-current="page"] { background: var(--accent); color: var(--accent-ink); opacity: 1; font-weight: 700; }
.side .grow { flex: 1; }
.side .btn { border-color: var(--bg); background: transparent; color: var(--bg); }
.side .btn:hover { background: rgba(127,127,127,.25); }
.side .seg { background: transparent; border-color: var(--bg); }
.side .seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); }
.amain { padding: 28px max(20px, env(safe-area-inset-right, 0px)) 56px 28px; display: grid; gap: 20px; align-content: start; min-width: 0; }
.amain h1 { font-size: 1.9rem; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px 18px; display: grid; gap: 2px; }
.kpi span { color: var(--muted); font-size: 0.85rem; }
.kpi b { font: 800 1.9rem/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.kpi.hot { background: var(--accent); border-color: var(--accent-ink); color: var(--accent-ink); }
.kpi.hot span { color: var(--accent-ink); }
.tbox { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
table .in { padding: 6px 8px; }
table input.in[type="number"] { width: 92px; text-align: right; }
.mini { display: flex; gap: 10px; align-items: center; }
.mini .tile { width: 40px; border-radius: 10px; aspect-ratio: 1; flex: none; }
.mini .tile svg { width: 84%; height: 84%; }
.mini .avatar { --s: 36px; }
.small-t { font-size: 0.8rem; color: var(--muted); }
.bars { display: grid; gap: 8px; }
.barrow { display: grid; grid-template-columns: 140px 1fr 70px; gap: 10px; align-items: center; font-size: 0.9rem; }
.barrow .tr { background: var(--surface-2); border-radius: 999px; height: 12px; overflow: hidden; }
.barrow .fl { height: 100%; background: var(--accent); border-radius: 999px; }
.barrow span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 500 11px var(--font-body); }
.chart .val { fill: var(--ink); font-weight: 700; }
.chart rect.b { fill: var(--accent); }
.chart line { stroke: var(--line); }
.formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.formgrid .wide { grid-column: 1 / -1; }
.swatches { display: flex; gap: 8px; }
.swatches button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; }
.swatches button[aria-pressed="true"] { border-color: var(--ink); outline: 2px solid var(--ink); outline-offset: 2px; }
.imgrow { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.imgrow .tile { width: 96px; border-radius: 14px; flex: none; }

@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; }
  .pdetail { grid-template-columns: 1fr; }
  .pdetail .tile { border-radius: 22px 22px 0 0; min-height: 0; aspect-ratio: 16 / 10; }
  .adm { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 12px; }
  .side .brand { padding: 0 8px 0 0; }
  .side .grow { display: none; }
  .amain { padding: 20px 16px 48px; }
  .barrow { grid-template-columns: 100px 1fr 60px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: translate .15s, box-shadow .15s; } .card:hover { translate: 0 -3px; box-shadow: 0 8px 0 var(--ink); }
  .btn { transition: background .15s; }
}
</style>
</head>
